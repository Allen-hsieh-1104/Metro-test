<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台北捷運全路網大會考</title>
    <style>
        :root {
            --metro-blue: #0070BD;
            --metro-green: #008659;
            --bg-color: #EBF0F5;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
            max-width: 520px;
            width: 100%;
            padding: 25px;
            text-align: center;
            border-top: 10px solid var(--metro-blue);
            position: relative;
        }

        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            background: #F0F4F8;
            padding: 6px;
            border-radius: 12px;
        }

        .diff-btn {
            flex: 1;
            padding: 10px 5px;
            border: none;
            border-radius: 8px;
            background: transparent;
            font-size: 0.9rem;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }

        .diff-btn.active {
            background: var(--metro-blue);
            color: white;
            box-shadow: 0 2px 8px rgba(0,112,189,0.3);
        }

        .diff-desc-box {
            background-color: #F8F9FA;
            border: 2px dashed #CBD5E1;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .diff-desc-box h3 {
            margin: 0 0 10px 0;
            color: var(--metro-blue);
            font-size: 1.15rem;
        }

        .diff-desc-box ul {
            margin: 0;
            padding-left: 20px;
            color: #475569;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .start-btn {
            background-color: var(--metro-green);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,134,89,0.3);
            transition: transform 0.1s;
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        .floating-hint-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #FFB020;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255,176,32,0.4);
            z-index: 10;
            transition: all 0.2s;
        }

        .floating-hint-btn:disabled {
            background-color: #CBD5E1;
            box-shadow: none;
            cursor: not-allowed;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: white;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            padding: 15px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            color: #666;
            cursor: pointer;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 10px;
        }

        .metro-line-progress {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
            position: relative;
        }

        .line-track {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 6px;
            background: #DDD;
            z-index: 1;
            transform: translateY(-50%);
        }

        .line-fill {
            position: absolute;
            top: 50%;
            left: 0;
            height: 6px;
            background: var(--metro-blue);
            z-index: 2;
            transform: translateY(-50%);
            transition: width 0.3s ease;
            width: 0%;
        }

        .tag-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 15px;
            background-color: #E1F0FF;
            color: var(--metro-blue);
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tag-badge.god-level {
            background-color: #FFE1E1;
            color: #D93838;
        }

        .mode-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

            border-radius: 12px;
            border: 1px solid #CCC;
            background: #FFF;
            cursor: pointer;
        }

        .mode-btn.active {

            color: #FFF;
            border-color: #333;
        }

            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1.05rem;

        .options-container {

            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #F8F9FA;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 0.95rem;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-weight: 500;
            line-height: 1.4;
        }

        .option-btn:hover {
            border-color: var(--metro-blue);
            background-color: #F0F7FF;
        }

        .option-btn.correct {
            background-color: #D4EDDA !important;
            border-color: #28A745 !important;
            color: #155724 !important;
        }

        .option-btn.wrong {
            background-color: #F8D7DA !important;
            border-color: #DC3545 !important;
            color: #721C24 !important;
        }

        .next-btn {
            background-color: var(--metro-green);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            display: none;
            width: 100%;
        }

        .metro-pass {
            background: linear-gradient(135deg, #0070BD, #004070);
            color: white;
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);

            background-color: #333;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>

    </div>

    <div id="result-screen" style="display: none;">

        </div>

        <button class="restart-btn" onclick="resetToIntro()">🔄 返回選單重新挑戰</button>
    </div>
</div>

        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (isCorrect) {
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } else {
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);

        } else if (selectedDifficulty === 'normal') {
            box.innerHTML = `
                <h3>💳 一般模式 (隨行常客)</h3>
                <ul>
                    <li><strong>題型內容：</strong>聲音搶答、生活情境路線與轉乘站規劃。</li>
                    <li><strong>提示次數：</strong>每局限制使用<span style="color:#D97706; font-weight:bold;">【3 次】</span>路線圖提示。</li>
                    <li><strong>適合對象：</strong>平時有搭乘捷運的大眾與捷運迷。</li>
                </ul>
            `;
        } else {
            box.innerHTML = `
                <h3>👑 困難模式 (特勤站長)</h3>
                <ul>
                    <li><strong>題型內容：</strong>全題型解鎖（包含文湖線全區題與高難度<span style="color:#D93838; font-weight:bold;">【神級魔王題】</span>）！</li>
                    <li><strong>提示次數：</strong><span style="color:#D93838; font-weight:bold;">【無提示】</span>，全憑硬實力挑戰！</li>
                    <li><strong>適合對象：</strong>對台北捷運路網瞭如指掌的高手。</li>
                </ul>
            `;
        }
    }

    function startQuizGame() {
        if (selectedDifficulty === 'easy') {
            remainingHints = Infinity;
            document.getElementById('quiz-title-diff').innerText = "🐣 簡單模式";
        } else if (selectedDifficulty === 'normal') {
            remainingHints = 3;
            document.getElementById('quiz-title-diff').innerText = "💳 一般模式";
        } else {
            remainingHints = 0;
            document.getElementById('quiz-title-diff').innerText = "👑 困難模式";
        }

        updateHintUI();
        document.getElementById('intro-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('hint-btn').style.display = 'block';

        initQuiz();
    }

    function updateHintUI() {
        const countSpan = document.getElementById('hint-count');
        if (remainingHints === Infinity) {
            countSpan.innerText = "無限";
            hintBtn.disabled = false;
        } else if (remainingHints > 0) {
            countSpan.innerText = `${remainingHints}次`;
            hintBtn.disabled = false;
        } else {
            countSpan.innerText = "0次";
            hintBtn.disabled = true;
        }
    }

    function openMapModal() {
        if (remainingHints !== Infinity && remainingHints <= 0) return;
        
        if (remainingHints !== Infinity) {
            remainingHints--;
            updateHintUI();
        }
        mapModal.style.display = 'flex';
    }

    function closeMapModal(event) {
        mapModal.style.display = 'none';
    }

    function generateDynamicQuestions(totalCount = 20) {
        const questions = [];

        for (let i = 0; i < totalCount; i++) {
            let type;
            if (selectedDifficulty === 'easy') {
                type = getRandomItem([0, 0, 1, 4]);
            } else if (selectedDifficulty === 'normal') {
                type = getRandomItem([0, 1, 2, 4]);
            } else {
                type = getRandomItem([0, 1, 2, 3, 4]);
            }

            if (type === 0) {
                const targetAudio = getRandomItem(audioPool);
                let distractorPool = targetAudio.category === "line" ? linesData.map(l => l.name + "進站音樂").filter(n => n !== targetAudio.answer) : soundOptionsPool.filter(s => s !== targetAudio.answer);
                questions.push({ type: "audio", audioSrc: targetAudio.src, question: "【聽音搶答】請聽這段聲響，請問這是什麼？", correctText: targetAudio.answer, options: shuffle([targetAudio.answer, ...shuffle(distractorPool).slice(0, 3)]) });
            } else if (type === 1) {
                const targetLine = getRandomItem(linesData);
                questions.push({ type: "text", question: `請問「${targetLine.name}」的官方代表顏色是什麼？`, correctText: targetLine.color, options: shuffle([targetLine.color, ...shuffle(linesData.map(l => l.color).filter(c => c !== targetLine.color)).slice(0, 3)]) });
            } else if (type === 2) {
                const scenario = getRandomItem(lifeScenarios);
                questions.push({ type: "text", question: `【生活搭乘題】${scenario.person}從「${scenario.from}」搭捷運去「${scenario.to}」，最佳轉乘站是？`, correctText: scenario.correctTransferStation, options: shuffle([scenario.correctTransferStation, ...scenario.wrongStations]) });
            } else if (type === 3) {
                const godQ = getRandomItem(godQuestions);
                questions.push({ type: "text", isGod: true, question: godQ.question, correctText: godQ.correctText, options: shuffle(godQ.options) });
            } else {
                const isBelong = Math.random() > 0.5;
                const targetLine = getRandomItem(linesData);
                const otherLines = linesData.filter(l => l.name !== targetLine.name);
                if (isBelong) {
                    const correctStation = getRandomItem(targetLine.allStations);
                    questions.push({ type: "text", question: `下列哪一個車站「屬於」${targetLine.name}？`, correctText: correctStation, options: shuffle([correctStation, ...shuffle(otherLines.map(l => getRandomItem(l.allStations))).slice(0, 3)]) });
                } else {
                    const correctStation = getRandomItem(getRandomItem(otherLines).allStations);
                    questions.push({ type: "text", question: `下列哪一個車站「不屬於」${targetLine.name}？`, correctText: correctStation, options: shuffle([correctStation, ...shuffle(targetLine.allStations).slice(0, 3)]) });
                }
            }
        }
        return questions;
    }

    function setMode(mode, btn) {
        playMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function initQuiz() {
        examQuestions = generateDynamicQuestions(20);
        currentQuestionIndex = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        nextBtn.style.display = "none";
        const data = examQuestions[currentQuestionIndex];

        const progressPercent = ((currentQuestionIndex + 1) / examQuestions.length) * 100;
        document.getElementById('line-fill').style.width = `${progressPercent}%`;

        document.getElementById('question-desc').innerText = `第 ${currentQuestionIndex + 1} 題 / 共 ${examQuestions.length} 題\n${data.question}`;
        optionsContainer.innerHTML = "";

        const badge = document.getElementById('type-badge');
        if (data.isGod) {
            badge.className = "tag-badge god-level";
            badge.innerText = '🔥 隱藏神級魔王題';
        } else {
            badge.className = "tag-badge";
            badge.innerText = data.type === 'audio' ? '🔊 聽音搶答題' : '🎲 路線知識題';
        }

        if (data.type === 'audio') {
            audioBtn.style.display = 'inline-flex';
            audioPlayer.src = data.audioSrc;
        } else {
            audioBtn.style.display = 'none';
            audioPlayer.src = "";
        }

        data.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
            btn.dataset.correct = (opt === data.correctText);
            btn.onclick = () => selectOption(btn);
            optionsContainer.appendChild(btn);
        });
    }

    function playAudio() {
        if (!audioPlayer.src) return;
        if (playMode === 'stealth') { audioPlayer.volume = 0.15; audioPlayer.playbackRate = 1.0; }
        else if (playMode === 'fast') { audioPlayer.volume = 1.0; audioPlayer.playbackRate = 1.5; }
        else { audioPlayer.volume = 1.0; audioPlayer.playbackRate = 1.0; }
        audioPlayer.play();
    }

    function selectOption(btn) {
        if (answered) return;
        answered = true;
        const isCorrect = btn.dataset.correct === "true";
        playBeepSound(isCorrect);

        if (isCorrect) { btn.classList.add('correct'); score++; } 
        else {
            btn.classList.add('wrong');
            optionsContainer.querySelectorAll('.option-btn').forEach(b => { if (b.dataset.correct === "true") b.classList.add('correct'); });
        }
        optionsContainer.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'none');
        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < examQuestions.length) loadQuestion();
        else showResult();
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('hint-btn').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const total = examQuestions.length;
        document.getElementById('pass-score').innerText = `${score} / ${total}`;
        
        let diffText = "🐣 簡單 (實習乘務員)";
        if (selectedDifficulty === 'normal') diffText = "💳 一般 (隨行常客)";
        if (selectedDifficulty === 'hard') diffText = "👑 困難 (特勤站長)";
        document.getElementById('pass-diff').innerText = diffText;

        let modeName = "標準模式";
        if (playMode === 'stealth') modeName = "🥷 鬼鬼祟祟模式";
        if (playMode === 'fast') modeName = "⚡ 1.5倍疾速模式";
        document.getElementById('pass-mode').innerText = modeName;

        let rank = "捷運普通卡";
        const ratio = score / total;
        if (ratio === 1) rank = "👑 捷運滿分神人 Pass";
        else if (ratio >= 0.8) rank = "💳 捷運資深司機 Pass";
        else if (ratio >= 0.5) rank = "🎫 捷運忠實常客 Pass";
        
        document.getElementById('pass-rank').innerText = rank;
    }

    function resetToIntro() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('hint-btn').style.display = 'none';
        document.getElementById('intro-screen').style.display = 'block';
    }

    renderDiffDescription();
</script>

</body>
</html>
