<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台北捷運全路網大會考</title>
    <style>
        :root {
            --metro-blue: #0070BD;
            --metro-green: #008659;
            --bg-color: #EBF0F5;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
            max-width: 520px;
            width: 100%;
            padding: 25px;
            text-align: center;
            border-top: 10px solid var(--metro-blue);
            position: relative;
        }

        .metro-line-progress {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
            position: relative;
        }

        .line-track {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 6px;
            background: #DDD;
            z-index: 1;
            transform: translateY(-50%);
        }

        .line-fill {
            position: absolute;
            top: 50%;
            left: 0;
            height: 6px;
            background: var(--metro-blue);
            z-index: 2;
            transform: translateY(-50%);
            transition: width 0.3s ease;
            width: 0%;
        }

        .tag-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 15px;
            background-color: #E1F0FF;
            color: var(--metro-blue);
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tag-badge.god-level {
            background-color: #FFE1E1;
            color: #D93838;
        }

        /* 難度選擇選單 */
        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            background: #F0F4F8;
            padding: 6px;
            border-radius: 12px;
        }

        .diff-btn {
            flex: 1;
            padding: 8px 5px;
            border: none;
            border-radius: 8px;
            background: transparent;
            font-size: 0.85rem;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }

        .diff-btn.active {
            background: var(--metro-blue);
            color: white;
            box-shadow: 0 2px 8px rgba(0,112,189,0.3);
        }

        /* 提示按鈕區域 */
        .hint-container {
            margin-bottom: 15px;
        }

        .hint-btn {
            background-color: #FFB020;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(255,176,32,0.3);
            transition: all 0.2s;
        }

        .hint-btn:disabled {
            background-color: #CCC;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 提示圖片彈窗/展示區 */
        .map-modal {
            display: none;
            margin-top: 10px;
            margin-bottom: 15px;
            border: 2px dashed #FFB020;
            border-radius: 10px;
            padding: 8px;
            background: #FFFDF7;
        }

        .map-modal img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .mode-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mode-btn {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid #CCC;
            background: #FFF;
            cursor: pointer;
        }

        .mode-btn.active {
            background: #333;
            color: #FFF;
            border-color: #333;
        }

        .audio-btn {
            background-color: var(--metro-blue);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(0,112,189,0.3);
            margin-bottom: 15px;
        }

        .audio-btn:active {
            transform: scale(0.95);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #F8F9FA;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 0.95rem;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-weight: 500;
            line-height: 1.4;
        }

        .option-btn:hover {
            border-color: var(--metro-blue);
            background-color: #F0F7FF;
        }

        .option-btn.correct {
            background-color: #D4EDDA !important;
            border-color: #28A745 !important;
            color: #155724 !important;
        }

        .option-btn.wrong {
            background-color: #F8D7DA !important;
            border-color: #DC3545 !important;
            color: #721C24 !important;
        }

        .next-btn {
            background-color: var(--metro-green);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            display: none;
            width: 100%;
        }

        .metro-pass {
            background: linear-gradient(135deg, #0070BD, #004070);
            color: white;
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            margin: 15px 0;
        }

        .metro-pass h2 {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 5px;
        }

        .pass-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.95rem;
        }

        .restart-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <div id="quiz-screen">
        <div class="difficulty-selector">
            <button class="diff-btn active" id="btn-easy" onclick="changeDifficulty('easy')">🐣 簡單</button>
            <button class="diff-btn" id="btn-normal" onclick="changeDifficulty('normal')">💳 一般</button>
            <button class="diff-btn" id="btn-hard" onclick="changeDifficulty('hard')">👑 困難</button>
        </div>

        <span class="tag-badge" id="type-badge">🎲 全路網動態題</span>
        <h1 style="font-size: 1.3rem; margin: 5px 0;">台北捷運大會考</h1>
        
        <div class="metro-line-progress">
            <div class="line-track"></div>
            <div class="line-fill" id="line-fill"></div>
        </div>

        <div class="mode-container">
            <button class="mode-btn active" onclick="setMode('normal', this)">標準原音</button>
            <button class="mode-btn" onclick="setMode('stealth', this)">🥷 鬼鬼祟祟(微音)</button>
            <button class="mode-btn" onclick="setMode('fast', this)">⚡ 1.5倍疾速</button>
        </div>

        <div class="hint-container">
            <button class="hint-btn" id="hint-btn" onclick="toggleMapHint()">💡 查看路線圖提示 (<span id="hint-count">無限</span>)</button>
            <div class="map-modal" id="map-modal">
                <p style="font-size:0.8rem; color:#888; margin:2px 0 5px 0;">🗺️ 台北捷運路線圖小幫手</p>
                <img src="https://upload.wikimedia.org/wikipedia/commons/ thumb/3/3d/Taipei_Metro_map_20200131.png/800px-Taipei_Metro_map_20200131.png" alt="台北捷運路線圖" id="metro-map-img">
            </div>
        </div>

        <p id="question-desc" style="color: #555; font-size: 0.95rem; margin-bottom: 15px; font-weight: bold;"></p>

        <button class="audio-btn" id="audio-btn" onclick="playAudio()">🔊 點擊感應音效</button>
        <audio id="quiz-audio"></audio>

        <div class="options-container" id="options-container"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">刷卡進入下一站 ➔</button>
    </div>

    <div id="result-screen" style="display: none;">
        <h1 style="font-size: 1.4rem; color: #333;">🎉 考驗完成！</h1>
        
        <div class="metro-pass">
            <h2>TAIPEI METRO MASTER PASS</h2>
            <div class="pass-row">
                <span>挑戰難度：</span>
                <strong id="pass-diff">🐣 簡單 (實習乘務員)</strong>
            </div>
            <div class="pass-row">
                <span>大會考得分：</span>
                <strong id="pass-score">0 / 20</strong>
            </div>
            <div class="pass-row">
                <span>聲音模式：</span>
                <strong id="pass-mode">標準模式</strong>
            </div>
            <div class="pass-row">
                <span>認證稱號：</span>
                <strong id="pass-rank">捷運專家</strong>
            </div>
        </div>

        <button class="restart-btn" onclick="restartQuiz()">🔄 現場重新抽 20 題</button>
    </div>
</div>

<script>
    function playBeepSound(isCorrect) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (isCorrect) {
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } else {
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }
        } catch(e) {}
    }

    const audioPool = [

        { src: "三鶯線.mp3", answer: "三鶯線進站音樂", category: "line" },
        { src: "開門聲音.mp3", answer: "開門聲音", category: "sound" },
        { src: "關門聲音.mp3", answer: "關門聲音", category: "sound" },
        { src: "關門警示音.mp3", answer: "關門警示音", category: "sound" },

    const linesData = [

        },
        { 
            name: "松山新店線", 
            color: "綠色", 
            allStations: ["松山", "南京三民", "台北小巨蛋", "南京復興", "松江南京", "中山", "北門", "西門", "小南門", "中正紀念堂", "古亭", "台電大樓", "公館", "萬隆", "景美", "大坪林", "七張", "新店區公所", "新店", "小碧潭"]
        },
        { 
            name: "板南線", 
            color: "藍色", 
            allStations: ["南港展覽館", "南港", "昆陽", "後山埤", "永春", "市政府", "國父紀念館", "忠孝敦化", "忠孝復興", "忠孝新生", "善導寺", "台北車站", "西門", "龍山寺", "江子翠", "新埔", "板橋", "府中", "亞東醫院", "海山", "土城", "永寧", "頂埔"]
        },
        { 
            name: "中和新蘆線", 
            color: "橘色", 
            allStations: ["南勢角", "景安", "永安市場", "頂溪", "古亭", "東門", "忠孝新生", "松江南京", "行天宮", "中山國小", "民權西路", "大橋頭", "三重國小", "三和國中", "徐匯中學", "三民高中", "蘆洲", "三重", "菜寮", "先嗇宮", "頭前庄", "新莊", "輔大", "丹鳳", "迴龍"]
        },
        {

            color: "黃色", 
            allStations: ["新北產業園區", "幸福", "頭前庄", "新埔民生", "板橋", "板新", "中原", "橋和", "中和", "景安", "景平", "秀朗橋", "十四張", "大坪林"]
        },
        { 
            name: "三鶯線", 
            color: "天藍色", 
            allStations: ["頂埔", "媽祖田", "椚樹腳", "埔頂", "富州", "三峽", "台北大學", "鶯歌", "陶瓷老街", "國華", "鶯歌桃福", "鳳鳴"]
        }
    ];

    const lifeScenarios = [
        {
            person: "小明",
            from: "丹鳳站（中和新蘆線）",
            to: "台北車站",
            correctTransferStation: "民權西路站 / 忠孝新生站",
            correctLines: "中和新蘆線 ➔ 淡水信義線 / 板南線",
            wrongStations: ["大坪林站", "南京復興站", "忠孝復興站"],
            wrongLines: ["中和新蘆線 ➔ 松山新店線", "板南線 ➔ 環狀線", "淡水信義線 ➔ 文湖線"]
        },
        {
            person: "小華",
            from: "板橋站（板南線）",
            to: "中山站",
            correctTransferStation: "台北車站",
            correctLines: "板南線 ➔ 淡水信義線",
            wrongStations: ["忠孝新生站", "東門站", "景安站"],
            wrongLines: ["板南線 ➔ 松山新店線", "中和新蘆線 ➔ 淡水信義線", "環狀線 ➔ 板南線"]
        },
        {
            person: "阿強",
            from: "公館站（松山新店線）",
            to: "市政府站",
            correctTransferStation: "西門站 / 中正紀念堂站",
            correctLines: "松山新店線 ➔ 板南線 / 淡水信義線",
            wrongStations: ["民權西路站", "南勢角站", "頭前庄站"],
            wrongLines: ["松山新店線 ➔ 中和新蘆線", "淡水信義線 ➔ 環狀線", "中和新蘆線 ➔ 板南線"]
        }
    ];

    const godQuestions = [
        {
            question: "【神級魔王題】請問下列哪一個轉乘站「沒有」與中和新蘆線交會？",
            correctText: "忠孝復興站",
            options: ["忠孝復興站", "民權西路站", "忠孝新生站", "松江南京站"]
        },
        {
            question: "【神級魔王題】台北捷運路網中，淡水信義線與松山新店線共交會於哪兩個車站？",
            correctText: "中山站、中正紀念堂站",
            options: ["中山站、中正紀念堂站", "台北車站、西門站", "東門站、古亭站", "民權西路站、松江南京站"]
        },
        {
            question: "【神級魔王題】中和新蘆線往北過「大橋頭站」後，會分岔為往哪兩個終點站的路線？",
            correctText: "迴龍 / 蘆洲",
            options: ["迴龍 / 蘆洲", "南勢角 / 新竹", "淡水 / 象山", "松山 / 新店"]
        }
    ];

    const soundOptionsPool = ["開門聲音", "關門聲音", "關門警示音", "終點站廣播/提示音", "轉乘站廣播/提示音", "進站警示音", "緊急求救音"];

    function getRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function shuffle(arr) {
        return [...arr].sort(() => Math.random() - 0.5);
    }

    function getRandomSample(arr, count) {
        return shuffle(arr).slice(0, count);
    }

    // 狀態變數
    let currentDifficulty = 'easy'; // easy, normal, hard
    let remainingHints = Infinity;  // 剩餘提示次數
    let examQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let playMode = 'normal';

    const audioPlayer = document.getElementById('quiz-audio');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const audioBtn = document.getElementById('audio-btn');
    const hintBtn = document.getElementById('hint-btn');
    const mapModal = document.getElementById('map-modal');

    // 切換難度
    function changeDifficulty(diff) {
        currentDifficulty = diff;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${diff}`).classList.add('active');

        // 設定提示次數
        if (diff === 'easy') {
            remainingHints = Infinity;
        } else if (diff === 'normal') {
            remainingHints = 3;
        } else {
            remainingHints = 0;
        }

        updateHintUI();
        initQuiz();
    }

    function updateHintUI() {
        mapModal.style.display = 'none';
        const countSpan = document.getElementById('hint-count');
        if (remainingHints === Infinity) {
            countSpan.innerText = "無限";
            hintBtn.disabled = false;
        } else if (remainingHints > 0) {
            countSpan.innerText = remainingHints;
            hintBtn.disabled = false;
        } else {
            countSpan.innerText = "0";
            hintBtn.disabled = true;
        }
    }

    function toggleMapHint() {
        if (mapModal.style.display === 'block') {
            mapModal.style.display = 'none';
        } else {
            if (remainingHints !== Infinity && remainingHints > 0) {
                remainingHints--;
                updateHintUI();
            }
            mapModal.style.display = 'block';
        }
    }

    // ================= 依難度生成題目 =================
    function generateDynamicQuestions(totalCount = 20) {
        const questions = [];

        for (let i = 0; i < totalCount; i++) {
            let type;

            if (currentDifficulty === 'easy') {
                // 簡單模式：聽音題(0) 幾率調高、色彩(1)、單一車站歸屬(4)
                type = getRandomItem([0, 0, 1, 4]);
            } else if (currentDifficulty === 'normal') {
                // 一般模式：聽音題(0)、色彩(1)、生活轉乘(2)、車站歸屬(4)
                type = getRandomItem([0, 1, 2, 4]);
            } else {
                // 困難模式：全題型含魔王題(3)
                type = getRandomItem([0, 1, 2, 3, 4]);
            }

            if (type === 0) {
                // 聽音題
                const targetAudio = getRandomItem(audioPool);
                let distractorPool = [];

                if (targetAudio.category === "line") {
                    distractorPool = linesData.map(l => l.name + "進站音樂").filter(n => n !== targetAudio.answer);
                } else {
                    distractorPool = soundOptionsPool.filter(s => s !== targetAudio.answer);
                }

                const wrongOptions = shuffle(distractorPool).slice(0, 3);
                const options = shuffle([targetAudio.answer, ...wrongOptions]);

                questions.push({
                    type: "audio",
                    audioSrc: targetAudio.src,
                    question: "【簡單聽音題】請聽這段捷運音效/廣播音樂，請問這是什麼？",
                    correctText: targetAudio.answer,
                    options: options
                });

            } else if (type === 1) {
                // 路線色彩
                const targetLine = getRandomItem(linesData);
                const allColors = linesData.map(l => l.color);
                const wrongColors = shuffle(allColors.filter(c => c !== targetLine.color)).slice(0, 3);
                const options = shuffle([targetLine.color, ...wrongColors]);

                questions.push({
                    type: "text",
                    question: `請問「${targetLine.name}」的官方代表顏色是什麼？`,
                    correctText: targetLine.color,
                    options: options
                });

            } else if (type === 2) {
                // 生活轉乘題
                const scenario = getRandomItem(lifeScenarios);
                const options = shuffle([scenario.correctTransferStation, ...scenario.wrongStations]);
                questions.push({
                    type: "text",
                    question: `【生活搭乘題】${scenario.person}從「${scenario.from}」搭捷運去「${scenario.to}」，最佳轉乘站是？`,
                    correctText: scenario.correctTransferStation,
                    options: options
                });

            } else if (type === 3) {
                // 魔王題
                const godQ = getRandomItem(godQuestions);
                questions.push({
                    type: "text",
                    isGod: true,
                    question: godQ.question,
                    correctText: godQ.correctText,
                    options: shuffle(godQ.options)
                });

            } else {
                // 單一車站歸屬
                const isBelong = Math.random() > 0.5;
                const targetLine = getRandomItem(linesData);
                const otherLines = linesData.filter(l => l.name !== targetLine.name);

                if (isBelong) {
                    const correctStation = getRandomItem(targetLine.allStations);
                    const wrongStations = shuffle(otherLines.map(l => getRandomItem(l.allStations))).slice(0, 3);
                    const options = shuffle([correctStation, ...wrongStations]);

                    questions.push({
                        type: "text",
                        question: `下列哪一個車站「屬於」${targetLine.name}？`,
                        correctText: correctStation,
                        options: options
                    });
                } else {
                    const correctStation = getRandomItem(getRandomItem(otherLines).allStations);
                    const wrongStations = getRandomSample(targetLine.allStations, 3);
                    const options = shuffle([correctStation, ...wrongStations]);

                    questions.push({
                        type: "text",
                        question: `下列哪一個車站「不屬於」${targetLine.name}？`,
                        correctText: correctStation,
                        options: options
                    });
                }
            }
        }
        return questions;
    }

    function setMode(mode, btn) {
        playMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function initQuiz() {
        examQuestions = generateDynamicQuestions(20);
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        nextBtn.style.display = "none";
        mapModal.style.display = "none";
        const data = examQuestions[currentQuestionIndex];

        const progressPercent = ((currentQuestionIndex + 1) / examQuestions.length) * 100;
        document.getElementById('line-fill').style.width = `${progressPercent}%`;

        document.getElementById('question-desc').innerText = `第 ${currentQuestionIndex + 1} 題 / 共 ${examQuestions.length} 題\n${data.question}`;
        optionsContainer.innerHTML = "";

        const badge = document.getElementById('type-badge');
        if (data.isGod) {
            badge.className = "tag-badge god-level";
            badge.innerText = '🔥 隱藏神級魔王題';
        } else {
            badge.className = "tag-badge";
            badge.innerText = data.type === 'audio' ? '🔊 聽音搶答題' : '🎲 路線知識題';
        }

        if (data.type === 'audio') {
            audioBtn.style.display = 'inline-flex';
            audioPlayer.src = data.audioSrc;
        } else {
            audioBtn.style.display = 'none';
            audioPlayer.src = "";
        }

        data.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
            btn.dataset.correct = (opt === data.correctText);
            btn.onclick = () => selectOption(btn);
            optionsContainer.appendChild(btn);
        });
    }

    function playAudio() {
        if (!audioPlayer.src) return;
        
        if (playMode === 'stealth') {
            audioPlayer.volume = 0.15;
            audioPlayer.playbackRate = 1.0;
        } else if (playMode === 'fast') {
            audioPlayer.volume = 1.0;
            audioPlayer.playbackRate = 1.5;
        } else {
            audioPlayer.volume = 1.0;
            audioPlayer.playbackRate = 1.0;
        }

        audioPlayer.play();
    }

    function selectOption(btn) {
        if (answered) return;
        answered = true;

        const isCorrect = btn.dataset.correct === "true";
        playBeepSound(isCorrect);

        if (isCorrect) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            optionsContainer.querySelectorAll('.option-btn').forEach(b => {
                if (b.dataset.correct === "true") b.classList.add('correct');
            });
        }

        optionsContainer.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'none');
        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < examQuestions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const total = examQuestions.length;
        document.getElementById('pass-score').innerText = `${score} / ${total}`;
        
        let diffText = "🐣 簡單 (實習乘務員)";
        if (currentDifficulty === 'normal') diffText = "💳 一般 (隨行常客)";
        if (currentDifficulty === 'hard') diffText = "👑 困難 (特勤站長)";
        document.getElementById('pass-diff').innerText = diffText;

        let modeName = "標準模式";
        if (playMode === 'stealth') modeName = "🥷 鬼鬼祟祟模式";
        if (playMode === 'fast') modeName = "⚡ 1.5倍疾速模式";
        document.getElementById('pass-mode').innerText = modeName;

        let rank = "捷運普通卡";
        const ratio = score / total;
        if (ratio === 1) rank = "👑 捷運滿分神人 Pass";
        else if (ratio >= 0.8) rank = "💳 捷運資深司機 Pass";
        else if (ratio >= 0.5) rank = "🎫 捷運忠實常客 Pass";
        
        document.getElementById('pass-rank').innerText = rank;
    }

    function restartQuiz() {
        initQuiz();
    }

    // 初始化
    changeDifficulty('easy');
</script>

</body>
</html>
